<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>

  <!-- Point Fontconfig to custom TeX Live OpenType fonts -->
  <dir>/usr/local/texlive/2025/texmf-dist/fonts/opentype</dir>

  <!-- Default Serif -> Source Serif 4 -->
  <alias>
    <family>serif</family>
    <prefer>
      <family>Source Serif 4</family>
    </prefer>
  </alias>

  <!-- Default Sans-Serif -> Inter -->
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Inter</family>
    </prefer>
  </alias>

  <!-- Standard alias rule so 'sans' queries also resolve to Inter -->
  <alias>
    <family>sans</family>
    <prefer>
      <family>Inter</family>
    </prefer>
  </alias>

  <!-- Default Monospace / Typewriter -> Commit Mono -->
  <alias>
    <family>monospace</family>
    <prefer>
      <family>CommitMono</family>
    </prefer>
  </alias>

  <!-- Explicit alias for Times New Roman -->
  <match target="pattern">
    <test qual="any" name="family">
      <string>Times New Roman</string>
    </test>
    <edit name="family" mode="assign" binding="same">
      <string>STIX MathJax Main</string>
    </edit>
  </match>

</fontconfig>
